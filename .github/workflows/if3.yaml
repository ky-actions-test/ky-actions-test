name: if-and-output

on: push

jobs:
  create-output:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.make-result.outputs.value}}

    steps:
      - name: make result
        id: make-result
        run: |
          echo "value=ok" >> $GITHUB_OUTPUT
          exit 1
      - name: check output
        run: echo "결과 :${{ steps.make-result.outputs.value}} "

  on-success:
    needs: [create-output]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - run: echo "성공시 실행됩니다. result=${{needs.create-output.outputs.result}}"